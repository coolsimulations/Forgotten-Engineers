modLoader="javafml"
loaderVersion="[${forge_loader_version},)"
issueTrackerURL="${mod_issues}"
logoFile="${mod_id}_logo.png"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    updateJSONURL="${mod_update_url}"
    displayURL="${mod_homepage}"
    displayName="${mod_name}"
    credits="${mod_credit}"
    authors="${mod_author}"
    description="${mod_desc}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

[modproperties.${mod_id}]
    catalogueImageIcon="${mod_id}_catalogue_icon.png"
    catalogueBackground="${mod_id}_catalogue_background.png"
    configuredBackground="minecraft:textures/block/anvil.png"
